
services:
  # 1. 데이터베이스 (MySQL)
  db:
    image: mysql:8.0
    container_name: my-local-db
    restart: always
    environment:
      MYSQL_DATABASE: my_database_name  # 사용할 DB 이름
      MYSQL_ROOT_PASSWORD: my_secret_password
      MYSQL_USER: user
      MYSQL_PASSWORD: user_password
    ports:
      - "3306:3306"  # [중요] 왼쪽: 내 컴퓨터 포트, 오른쪽: 도커 내부 포트
    volumes:
      - ./db_data:/var/lib/mysql # 데이터가 날아가지 않게 로컬에 저장

  # 2. 백엔드 (Spring Boot)
  backend-app:
    build: ./backend
    container_name: my-project-backend
    ports:
      - "8080:8080"
    depends_on:
      - db
    environment:
      # Docker 내부에서는 'localhost' 대신 서비스 이름인 'db'를 사용합니다.
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/dev?serverTimezone=UTC&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 1234

  # 3. 프론트엔드 (Nginx)
  frontend-app:
    build: ./frontend
    container_name: my-project-frontend
    ports:
      - "80:80"  # 브라우저 접속 포트
    depends_on:
      - backend-app

volumes:
  db_data: