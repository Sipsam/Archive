version: '3.8'

services:
  # 1. 데이터베이스 (MySQL)
  mysql:
    image: mysql:8.0
    container_name: mysql-container
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: mydb
      MYSQL_USER: user
      MYSQL_PASSWORD: 1234
    ports:
      - "3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
    networks:
      - springboot-net

  # 2. 백엔드 (Spring Boot)
  springboot:
    build: .
    container_name: springboot-container
    restart: always
    ports:
      - "8080:8080"
    depends_on:
      - mysql
    environment:
      # 서비스 이름(mysql)을 호스트로 사용
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/mydb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: user
      SPRING_DATASOURCE_PASSWORD: 1234
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    networks:
      - springboot-net

  # 3. 프론트엔드
  frontend-app:
    # 경로: 4-project-frontend 폴더 안의 frontend 폴더로 지정
    build: ../4-project-frontend/frontend
    container_name: 4-project-frontend

    # [중요] 왼쪽(내컴퓨터): 3000 <-> 오른쪽(도커Nginx): 80
    ports:
      - "3000:80"

    volumes:
      # [핵심] HTML 파일을 수정하면 바로 반영되도록 연결
      - ../4-project-frontend/frontend:/usr/share/nginx/html

    # (stdin_open, tty는 없어도 됩니다)
    depends_on:
      - springboot
    networks:
      - springboot-net

  # 4. DB 관리 도구 (phpMyAdmin)
  phpmyadmin:
    platform: linux/amd64
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    ports:
      - "8081:80"
    environment:
      PMA_HOST: mysql
      PMA_PORT: 3306
    depends_on:
      - mysql
    networks:
      - springboot-net

networks:
  springboot-net:
    driver: bridge