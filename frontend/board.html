<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together - 게시판(후기)</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/board.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">TOGETHER</a>
            <div class="header-actions">
                <a href="index.html" class="btn btn-secondary">메인으로</a>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">게시판 (후기)</h1>
        
        <div class="board-tabs">
            <button class="board-tab active" onclick="switchBoardTab('list')">목록</button>
            <div class="tab-divider"></div>
            <button class="board-tab" onclick="switchBoardTab('write')">✎ 쓰기</button>
            <div class="tab-divider"></div>
            <button class="board-tab" onclick="location.href='qa.html'">Q/A <span>→</span></button>
        </div>

        <div class="board-content">
            <div class="board-list" id="boardList">
                <div style="text-align: center; padding: 40px; color: #888;">
                    게시글을 불러오는 중입니다...
                </div>
            </div>

            <div class="write-section hidden" id="writeSection">
                <h2 style="margin-bottom: 20px;">후기 작성</h2>
                <p style="color: #666; font-size: 14px; margin-bottom: 15px;">
                    * 후기를 작성하면 <strong>100 포인트</strong>가 적립됩니다!
                </p>
                <form class="write-form">
                    <div class="form-group">
                        <label for="title">제목</label>
                        <input type="text" id="title" name="title" required placeholder="제목을 입력하세요">
                    </div>
                    <div class="form-group">
                        <label for="content">내용</label>
                        <textarea id="content" name="content" required placeholder="후기 내용을 작성해주세요" style="min-height: 200px;"></textarea>
                    </div>
                    <div class="btn-group" style="display: flex; gap: 10px; justify-content: flex-end;">
                        <button type="button" class="btn btn-secondary" onclick="switchBoardTab('list')">취소</button>
                        <button type="submit" class="btn btn-primary">등록하기</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/board.js"></script>
</body>
</html>
