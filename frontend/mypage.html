<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together - 마이페이지</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/mypage.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div class="logo">Together</div>
            <div class="header-actions">
                <a href="index.html" class="btn btn-secondary">메인으로</a>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">마이페이지</h1>
        
        <div class="mypage-layout">
            <div class="profile-section">
                <div class="profile-card">
                    <div class="avatar">
                        <svg width="80" height="80" viewBox="0 0 80 80">
                            <circle cx="40" cy="30" r="15" fill="#ccc"/>
                            <path d="M 20 70 Q 20 50 40 50 Q 60 50 60 70" stroke="#ccc" stroke-width="3" fill="none"/>
                        </svg>
                    </div>
                    <div class="profile-info">
                        <div class="name-section">
                            <span class="name-label">이름</span>
                            <span class="name-value" id="userName">사용자</span>
                            <span class="score">36.5</span>
                        </div>
                        <div class="point-section">
                            <span class="point-label">포인트</span>
                            <span class="point-value" id="userPoints">0</span>
                            <button class="point-detail-btn">🔍</button>
                        </div>
                    </div>
                </div>

                <div class="menu-section">
                    <ul class="mypage-menu">
                        <li><a href="#orders">주문 내역</a></li>
                        <li><a href="#wishlist">찜한 상품</a></li>
                        <li><a href="#reviews">내 후기</a></li>
                        <li><a href="#settings">설정</a></li>
                        <li><a href="#" onclick="logout()">로그아웃</a></li>
                    </ul>
                </div>
            </div>

            <div class="content-section">
                <div class="content-card">
                    <h2>내 활동</h2>
                    <div class="activity-list">
                        <div class="activity-item">활동 내역 1</div>
                        <div class="activity-item">활동 내역 2</div>
                        <div class="activity-item">활동 내역 3</div>
                        <div class="activity-item">활동 내역 4</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/mypage.js"></script>
</body>
</html>
