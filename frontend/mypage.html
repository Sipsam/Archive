<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together - 마이페이지</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/mypage.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">TOGETHER</a>
            <div class="header-actions">
                <a href="index.html" class="btn btn-secondary">메인으로</a>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">마이페이지</h1>
        
        <div class="mypage-layout">
            <div class="profile-section">
                <div class="profile-card">
                    <div class="avatar">
                        <svg width="80" height="80" viewBox="0 0 80 80">
                            <circle cx="40" cy="30" r="15" fill="#ccc"/>
                            <path d="M 20 70 Q 20 50 40 50 Q 60 50 60 70" stroke="#ccc" stroke-width="3" fill="none"/>
                        </svg>
                    </div>
                    <div class="profile-info">
                        <div class="name-section">
                            <span class="name-label">이름</span>
                            <!--사용자-->
                            <span class="name-value" id="userName"></span>
                            <!--매너온도-->
                            <span class="score" id="manner_temp"></span>
                        </div>
                        <div class="point-section">
                            <span class="point-label">포인트</span>
                            <span class="point-value" id="userPoints">0</span>
                            <a href="point.html"><button class="point-detail-btn">🔍</button></a>
                        </div>
                    </div>
                </div>

                <div class="menu-section">
                    <ul class="mypage-menu">
                        <li><a href="#orders">주문 내역</a></li>
                        <li><a href="#wishlist">찜한 상품</a></li>
                        <li><a href="#reviews">내 후기</a></li>
                        <li><a href="#settings">설정</a></li>
                        <li><a href="#" onclick="logout()">로그아웃</a></li>
                    </ul>
                </div>
            </div>

            <div class="content-section">
                <div class="content-card">
                    <h2>참여 중인 모집글</h2>
                    <div class="participation-list" id="participationList">
                        <!-- 동적으로 로드됨 -->
                    </div>
                </div>

                <div class="content-card" style="margin-top: 20px;" id="settings">
                    <h2>설정</h2>
                    <form id="settingsForm" class="settings-form">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="settingName">이름</label>
                                <input type="text" id="settingName" placeholder="이름을 입력하세요">
                            </div>
                            <div class="form-group">
                                <label for="settingNickname">닉네임</label>
                                <input type="text" id="settingNickname" placeholder="닉네임을 입력하세요">
                            </div>
                            <div class="form-group">
                                <label for="settingEmail">이메일</label>
                                <input type="email" id="settingEmail" placeholder="이메일을 입력하세요">
                            </div>
                            <div class="form-group">
                                <label for="settingPhone">전화번호</label>
                                <input type="tel" id="settingPhone" placeholder="전화번호를 입력하세요">
                            </div>
                            <div class="form-group">
                                <label for="settingAddress">주소</label>
                                <input type="text" id="settingAddress" placeholder="주소를 입력하세요">
                            </div>
                            <div class="form-group">
                                <label for="settingAddressDetail">상세 주소</label>
                                <input type="text" id="settingAddressDetail" placeholder="상세 주소를 입력하세요">
                            </div>
                            <div class="form-group">
                                <label for="settingZip">우편번호</label>
                                <input type="text" id="settingZip" placeholder="우편번호">
                            </div>
                            <div class="form-group full-width">
                                <label for="settingPassword">현재 비밀번호</label>
                                <input type="password" id="settingPassword" placeholder="변경 전 비밀번호를 입력하세요" autocomplete="current-password">
                                <small class="form-helper-text">정보를 저장하기 전에 현재 비밀번호 확인이 필요합니다.</small>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" id="settingsSaveBtn" class="btn btn-primary">저장하기</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/mypage.js"></script>
</body>
</html>
