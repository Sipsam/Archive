<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together - 채팅</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">TOGETHER</a>
            <div class="header-actions">
                <a href="index.html" class="btn btn-secondary">메인으로</a>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">채팅</h1>
        
        <div class="chat-layout">
            <aside class="chat-sidebar">
                <div class="chat-list" id="chatRoomList">
                    <div style="padding:15px; text-align:center; color:#999;">채팅방 로딩 중...</div>
                </div>
            </aside>

            <main class="chat-main">
                <div class="chat-header">
                    <div class="chat-partner">
                        <span id="chatRoomTitle" style="font-weight:bold; font-size:18px;">채팅방을 선택해주세요</span>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div style="text-align:center; padding-top:50px; color:#aaa;">
                        왼쪽 목록에서 채팅방을 선택하면 대화가 시작됩니다.
                    </div>
                </div>

                <div class="chat-input-area">
                    <input type="text" class="chat-input" id="chatInput" placeholder="메시지를 입력하세요..." disabled>
                    <button class="send-btn" id="sendBtn" disabled>전송</button>
                </div>
            </main>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
