<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together - 채팅</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/chat.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div href="index.html" class="logo">TOGETHER</div>
            <div class="header-actions">
                <a href="index.html" class="btn btn-secondary">메인으로</a>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">채팅</h1>
        
        <div class="chat-layout">
            <aside class="chat-sidebar">
                <div class="chat-list">
                    <div class="chat-item active">
                        <div class="chat-avatar">👤</div>
                        <div class="chat-info">
                            <div class="chat-name">사용자1</div>
                            <div class="chat-preview">안녕하세요! 공동구매 참여하고 싶습니다.</div>
                        </div>
                    </div>
                    <div class="chat-item">
                        <div class="chat-avatar">👤</div>
                        <div class="chat-info">
                            <div class="chat-name">사용자2</div>
                            <div class="chat-preview">배송은 언제 되나요?</div>
                        </div>
                    </div>
                    <div class="chat-item">
                        <div class="chat-avatar">👤</div>
                        <div class="chat-info">
                            <div class="chat-name">사용자3</div>
                            <div class="chat-preview">감사합니다!</div>
                        </div>
                    </div>
                </div>
            </aside>

            <main class="chat-main">
                <div class="chat-header">
                    <div class="chat-partner">
                        <div class="chat-avatar">👤</div>
                        <span>사용자1</span>
                    </div>
                    <div class="chat-actions">
                        <button class="icon-btn">⚙️</button>
                        <button class="icon-btn">📌</button>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="message received">
                        <div class="message-content">안녕하세요! 공동구매 참여하고 싶습니다.</div>
                        <div class="message-time">14:30</div>
                    </div>
                    <div class="message sent">
                        <div class="message-content">네, 환영합니다! 어떤 상품에 관심이 있으신가요?</div>
                        <div class="message-time">14:31</div>
                    </div>
                    <div class="message received">
                        <div class="message-content">공동구매 상품명에 참여하고 싶습니다.</div>
                        <div class="message-time">14:32</div>
                    </div>
                </div>

                <div class="chat-input-area">
                    <input type="text" class="chat-input" id="chatInput" placeholder="메시지를 입력하세요...">
                    <button class="send-btn" onclick="sendMessage()">전송</button>
                </div>
            </main>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
