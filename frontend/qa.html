<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together - Q/A</title>
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/qa.css">
</head>
<body>
    <header>
        <div class="header-content">
            <div href="index.html" class="logo">TOGETHER</div>
            <div class="header-actions">
                <a href="index.html" class="btn btn-secondary">메인으로</a>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 class="page-title">Q/A</h1>
        
        <div class="qa-section">
            <div class="qa-item">
                <div class="qa-header">
                    <span class="qa-number">Q1</span>
                    <span class="qa-title">배송은 언제 되나요?</span>
                    <span class="qa-date">2024/01/15</span>
                </div>
                <div class="qa-content">
                    <p>일반적으로 주문 후 3-5일 내 배송됩니다.</p>
                </div>
            </div>

            <div class="qa-item">
                <div class="qa-header">
                    <span class="qa-number">Q2</span>
                    <span class="qa-title">환불 정책은 어떻게 되나요?</span>
                    <span class="qa-date">2024/01/14</span>
                </div>
                <div class="qa-content">
                    <p>상품 수령 후 7일 이내 환불 가능합니다.</p>
                </div>
            </div>

            <div class="qa-item">
                <div class="qa-header">
                    <span class="qa-number">Q3</span>
                    <span class="qa-title">공동구매 인원이 모이지 않으면 어떻게 되나요?</span>
                    <span class="qa-date">2024/01/13</span>
                </div>
                <div class="qa-content">
                    <p>인원이 모이지 않으면 자동으로 취소되며, 결제 금액은 전액 환불됩니다.</p>
                </div>
            </div>
        </div>

        <div class="qa-form-section">
            <h2>질문하기</h2>
            <form class="qa-form">
                <div class="form-group">
                    <label>제목</label>
                    <input type="text" name="title" required>
                </div>
                <div class="form-group">
                    <label>내용</label>
                    <textarea name="content" required></textarea>
                </div>
                <button type="submit" class="btn btn-primary">질문 등록</button>
            </form>
        </div>
    </div>

    <script src="js/common.js"></script>
    <script src="js/qa.js"></script>
</body>
</html>
