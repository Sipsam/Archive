<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together - 결제</title>
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/payment.css">
    <script src="https://js.tosspayments.com/v2/standard"></script>
</head>
<body>
    <header>
        <div class="header-content">
            <a href="index.html" class="logo">TOGETHER</a>
            <div class="header-actions">
                <a href="index.html" class="btn btn-secondary">메인으로</a>
            </div>
        </div>
    </header>

    <div class="container">
        <div id="payment-wrapper">
            <h1 class="page-title">결제</h1>
            
            <div class="payment-layout">
                <div class="payment-main">
                    <div class="payment-section">
                        <h2>상품정보</h2>
                        <div class="product-summary">
                            <div class="product-name">로딩 중...</div>
                            <div class="product-details">
                                </div>
                        </div>
                    </div>

                    <div class="payment-section">
                        <h2>주문자 정보</h2>
                        <form class="orderer-form" id="order-form">
                            <div class="form-group">
                                <label>이름</label>
                                <input type="text" id="username" name="name" required>
                            </div>
                            <div class="form-group">
                                <label>전화번호</label>
                                <input type="tel" id="mobile" name="phone" required>
                            </div>
                            <div class="form-group">
                                <label>이메일</label>
                                <input type="email" id="email" name="email" required>
                            </div>
                            <div class="form-group">
                                <label>배송지 주소</label>
                                <input type="text" name="address" required>
                            </div>
                        </form>
                    </div>
                    
                    <div class="payment-section">
                        <h2>결제 수단</h2>
                        <div id="payment-method"></div>
                        <div id="agreement"></div>
                    </div>

                    <div class="payment-section">
                        <h2>요청 사항</h2>
                        <textarea name="request" placeholder="배송 시 요청사항을 입력하세요..."></textarea>
                    </div>
                </div>

                <div class="payment-sidebar">
                    <div class="payment-summary">
                        <h2>총결제 내용</h2>
                        <div class="summary-details">
                            <div class="summary-row">
                                <span>상품 금액</span>
                                <span>-</span>
                            </div>
                            <div class="summary-row">
                                <span>배송비</span>
                                <span>-</span>
                            </div>
                            <div class="summary-divider"></div>
                            <div class="summary-row total">
                                <span>총 결제금액</span>
                                <span>-</span>
                            </div>
                        </div>
                        <div class="payment-circle">
                            <div class="circle-content">
                                <div class="amount">-</div>
                            </div>
                        </div>
                        <button class="btn btn-primary btn-payment" id="payment-button">결제하기</button>
                    </div>
                </div>
            </div>
        </div>

        <div id="review-wrapper" class="review-container">
            <h2>결제가 완료되었습니다! 🎉</h2>
            <p class="review-desc">방장님에 대한 매너 온도를 평가해주세요.</p>

            <div class="star-rating" id="starRating">
                <span class="star" data-value="1">★</span>
                <span class="star" data-value="2">★</span>
                <span class="star" data-value="3">★</span>
                <span class="star" data-value="4">★</span>
                <span class="star" data-value="5">★</span>
            </div>
            <div style="margin-bottom: 20px; font-weight: bold; color: #4a90e2;">
                <span id="ratingValue">0</span> / 5 점
            </div>

            <div class="review-actions">
                <button class="btn-skip" onclick="exitToMain()">평가 건너뛰기</button>
                <button class="btn-submit-review" onclick="submitReview()">평가 완료</button>
            </div>
        </div>

    </div>

    <script src="js/common.js"></script>
    <script src="js/payment.js"></script>
</body>
</html>
