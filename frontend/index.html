<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Together - 메인페이지</title>
    <!-- CSS 링크는 그대로 유지 -->
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
    <div class="header-content">
        <a href="index.html" class="logo">TOGETHER</a>
        <div class="header-actions">
            <a href="login.html" class="btn btn-secondary" id="authButton">로그인/회원가입</a>
        </div>
    </div>
</header>
    <!--
    <nav>
        <div class="nav-tabs">
            // 2. 모집글 목록 -> 탭 클릭 이벤트를 JS에서 관리
            <button class="nav-tab active" id="navTabOnline">온라인</button>
            <div class="nav-divider"></div>
            <button class="nav-tab" id="navTabOffline">오프라인</button>
        </div>
    </nav> -->

    <div class="container">
        <div class="main-layout">
            <aside class="sidebar">
                <h3>메뉴바</h3>
                <!-- 카테고리 메뉴바 (정적) -->
                <ul class="menu-list">
                    <!--모달 팝업-->
                    <div class="modal">
                        <div class="modal_popup">
                            <h3>모집글 신청</h3>
                            
                            <div class="modal_form_content">
                                <div class="input-box">
                                    <label for="productName">상품명</label>
                                    <input type="text" id="productName" placeholder="예: 섬유유연제">
                                </div>

                                <div class="input-box">
                                    <label for="productUrl">구매 링크 (네이버 스마트 스토어 URL)</label>
                                    <input type="url" id="productUrl" placeholder="https://smartstore.naver.com/...">
                                </div>

                                <div class="input-box">
                                    <label for="targetHeadcount">모집 인원 (본인 포함)</label>
                                    <input type="number" id="targetHeadcount" min="2" placeholder="예: 4">
                                </div>

                                <hr style="margin: 15px 0; border: 0; border-top: 1px solid #eee;">

                                <div class="input-box">
                                    <label for="recruitTitle">게시글 제목</label>
                                    <input type="text" id="recruitTitle" placeholder="예: 단백질 쉐이크 같이 사실 분 구해요!">
                                </div>

                                <div class="input-box">
                                    <label for="recruitContent">내용</label>
                                    <textarea id="recruitContent" placeholder="남길 코멘트 등의 내용을 적어주세요."></textarea>
                                </div>

                                <div class="input-box">
                                    <label for="recruitEndDate">모집 마감 시간</label>
                                    <input type="datetime-local" id="recruitEndDate">
                                </div>
                            </div>

                            <div class="modal_btn_area">
                                <button type="button" class="submit_btn" onclick="submitRecruitment()">등록하기</button>
                                <button type="button" class="close_btn">닫기</button>
                            </div>
                        </div>
                    </div>
                    <!--end 모달 팝업-->
                    <button type="button" class="modal_btn">모집글 신청</button>
                    <li><a href="index.html">메인페이지</a></li>
                    <li><a href="recruitment-list.html">모집글 목록</a></li>
                    <li><a href="board.html">게시판(후기)</a></li>
                    <li><a href="mypage.html">마이페이지</a></li>
                    <li><a href="chat.html">채팅</a></li>
                    <li><a href="point.html">포인트 구매</a></li>
                </ul>
            </aside>

            <main class="main-content">
                <!-- 3. 검색창 -> JS에서 이벤트를 받아 API 호출 -->
                <div class="search-section">
                    <input type="text" class="search-input" id="searchInput" placeholder="상품을 검색하세요...">
                    <button class="search-btn" id="searchButton">🔍</button>
                </div>

                <!-- 2. 모집글 목록 -> API 응답으로 동적으로 채워질 영역 -->
                <div class="content-grid" id="contentGrid">
                    <!-- JS가 이곳에 .content-card를 동적으로 생성합니다. -->
                    <!-- 기존의 정적 카드 3개는 제거 -->
                </div>
            </main>

            <!-- 4. 실시간 채팅방 목록 -> API 응답으로 동적으로 채워질 영역 -->
            <aside class="sidebar right-sidebar">
                <h3>채팅 목록</h3>
                <ul class="popular-list" id="chatListContainer">
                    <!-- JS가 이곳에 채팅방 목록을 동적으로 생성합니다. -->
                    <!-- <li>(로그인 시 채팅방 목록이 여기에 표시됩니다)</li> -->
                </ul>
            </aside>
        </div>
    </div>

    <!-- JS 파일 로드 -->
    <script src="js/common.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
