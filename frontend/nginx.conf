server {
    listen 80;

    # 1. 프론트엔드 정적 파일 제공
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # 2. /api로 시작하는 요청은 백엔드로 전달 (프록시)
    location /api {
        proxy_pass http://backend-app:8080; # backend-app은 docker-compose 서비스명
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}